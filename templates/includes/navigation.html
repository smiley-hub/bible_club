{% load static %}
<header class="site-header wrap">
  <a class="brand" href="{% url 'core:home' %}" aria-label="{{ club.name|default:'METU Bible Club' }} home">
    <img src="{% static 'images/book.svg' %}" width="48" height="42" alt="">
    <span>{{ club.name|default:'METU Bible Club' }}</span>
  </a>
  <button class="menu-toggle" type="button" aria-controls="primary-nav" aria-expanded="false" hidden>Menu <svg class="menu-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true" focusable="false" style="display:inline-block;width:18px;height:18px;vertical-align:middle"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
  <nav id="primary-nav" aria-label="Main navigation">
    <a href="{% url 'core:home' %}" {% if request.resolver_match.url_name == "home" %}aria-current="page"{% endif %}>Home</a>
    <a href="{% url 'core:our_story' %}" {% if request.resolver_match.url_name == "our_story" %}aria-current="page"{% endif %}>Our Story</a>
    <a href="{% url 'events:list' %}" {% if request.resolver_match.namespace == "events" %}aria-current="page"{% endif %}>Events</a>
    <a href="{% url 'core:contact' %}" {% if request.resolver_match.url_name == "contact" %}aria-current="page"{% endif %}>Get in Touch</a>
    <a class="button small" href="{% url 'events:list' %}#upcoming">Join us <span aria-hidden="true">{% include 'includes/arrow.html' with direction='up-right' %}</span></a>
  </nav>
</header>
